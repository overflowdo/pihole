# Pi-hole v6 – Wildcard-DNS für apphost.lan
#
# HOST-Networking (network_mode: host): FTL bindet die Host-Interfaces direkt
# -> IPv4 UND IPv6 nativ + echte Client-IPs. Host-Net verträgt sich nicht mit
# userns-remap, daher userns_mode: host -> der Container läuft als ECHTES root.
# Auf dieser dedizierten DNS-VM bewusst ok; gehärtet bleibt es per cap_drop:[ALL]
# (nur nötige Caps), no-new-privileges, System-seccomp/AppArmor + Resource-Limits.
name: pihole

volumes:
  # Pi-hole-State (v6: pihole.toml, FTL-DB, Gravity, Listen).
  pihole_etc:
    name: pihole_etc

services:
  pihole:
    image: docker.io/pihole/pihole:latest
    # ^ Für Reproduzierbarkeit auf ein Digest pinnen (Renovate macht das automatisch):
    #     image: docker.io/pihole/pihole:2025.xx.x@sha256:...
    #   Digest holen:  skopeo inspect docker://docker.io/pihole/pihole:latest | jq -r .Digest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    runtime: runc

    # Host-Networking: FTL lauscht direkt auf allen Host-Interfaces (0.0.0.0 + ::,
    # inkl. der statischen IPv6-ULA). Keine ports:-Publizierung nötig; die
    # nftables-Firewall (networking.nix) beschränkt 53/80 aufs LAN.
    network_mode: "host"
    # host-net verlangt das Opt-out aus userns-remap -> echtes root (s. Kopf-Kommentar).
    userns_mode: "host"

    # docker compose liest ./.env automatisch für die ${...}-Interpolation.
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Admin-/API-Passwort (Pi-hole v6) – MUSS in .env gesetzt sein.
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password:?FTLCONF_webserver_api_password fehlt in .env}
      # Upstream = FritzBox, damit fritz.box & andere lokale Namen weiter auflösen.
      FTLCONF_dns_upstreams: ${FTLCONF_dns_upstreams:-192.168.178.1}
      # Anfragen aus dem ganzen LAN + von Docker-Containern annehmen.
      FTLCONF_dns_listeningMode: "all"
      # WICHTIG (v6): /etc/dnsmasq.d/ laden -> aktiviert die Wildcard-Datei unten.
      FTLCONF_misc_etc_dnsmasq_d: "true"

      # ── Sicherheit / Privacy ───────────────────────────────────────────────
      # (Falsche FTLCONF-Keys sind ungefährlich: FTL loggt sie als "invalid" und
      #  ignoriert sie. Alle gültigen Keys: docker exec pihole pihole-FTL --config)
      FTLCONF_dns_dnssec: "true"           # DNSSEC-Validierung. FALLS einzelne Domains
                                           #   SERVFAIL liefern -> hier auf "false" setzen.
      FTLCONF_dns_domainNeeded: "true"     # Namen ohne Punkt nicht ins Internet leaken
      FTLCONF_dns_bogusPriv: "true"        # Reverse-Lookups privater IPs nicht upstream fragen
      FTLCONF_dns_blockESNI: "true"        # ESNI-Lookups blocken (verhindert Filter-Bypass)
      FTLCONF_dns_blocking_mode: "NULL"    # blockierte Domains -> 0.0.0.0/:: (schnell, sauber)
      FTLCONF_dns_cache_size: "10000"      # großer DNS-Cache -> weniger Upstream-Anfragen
      FTLCONF_webserver_api_max_sessions: "6"    # max. gleichzeitige Admin-Logins
      FTLCONF_webserver_session_timeout: "1800"  # Admin-Session-Timeout (Sekunden)
      # FTL als root laufen lassen (bei host-net/userns_mode:host echtes root).
      # Nötig wegen no-new-privileges: der Kernel ignoriert File-Caps beim exec,
      # weshalb Pi-holes non-root-Weg (setcap auf pihole-FTL) scheitert. Als root
      # nutzt FTL direkt die cap_add-Caps unten.
      DNSMASQ_USER: "root"

    volumes:
      - pihole_etc:/etc/pihole
      # Das GANZE dnsmasq.d/ read-only in den Container: die apphost-Wildcard
      # UND alle eigenen Regel-Dateien. Neue Datei dnsmasq.d/*.conf anlegen
      # -> up/restart, fertig. Pi-hole v6 legt seine eigene Config unter
      # /etc/pihole/ ab, hier wird also nichts überschrieben.
      - ./dnsmasq.d:/etc/dnsmasq.d:ro

    # ── Rechte / UID-Modell ────────────────────────────────────────────────────
    # userns_mode: host -> der Container läuft als ECHTES root (nötig für
    # host-networking). Deshalb KEIN `user:`-Override und DNSMASQ_USER=root:
    # FTL läuft als root und nutzt direkt die cap_add-Caps unten (kein setcap).
    #   • /etc/pihole = Named Volume -> gehört real root, FTL initialisiert es
    #     direkt. Beim UMSTIEG von userns-remap gehört das alte Volume noch der
    #     Remap-Range -> einmal frisch machen: down; docker volume rm pihole_etc; up.
    #   • dnsmasq.d = :ro Bind-Mount, world-readable (0644) -> lesbar.
    #   • .env liest nur `docker compose` am Host (als pihole, 0600).

    # ── Härtung ────────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN              # Entrypoint chownt /etc/pihole
      - DAC_OVERRIDE       # in /etc/pihole schreiben unabhängig von Dateirechten
      - FOWNER             # chmod auf Volume-Dateien, die dem pihole-User (uid 1000) gehören
      - SETGID             # User-Setup / Privilegien-Handling
      - SETUID
      - NET_BIND_SERVICE   # Ports 53/80 (<1024) binden
      - NET_RAW            # FTL: ARP-/Neighbor-Checks
      - SYS_NICE           # FTL: Prozess-Prioritäten
      # Kein SETFCAP nötig: FTL läuft via DNSMASQ_USER=root (s.o.) als gemapptes root.

    deploy:
      resources:
        limits:       {cpus: "1.0", memory: 512M}
        reservations: {memory: 128M}

    # Hinweis: Das Pi-hole-Image bringt einen eigenen HEALTHCHECK mit (FTL/DNS),
    # daher hier keine zusätzliche healthcheck-Definition.

    labels:
      - "traefik.enable=false"
