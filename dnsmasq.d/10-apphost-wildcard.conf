# ─────────────────────────────────────────────────────────────────────────────
# Wildcard-DNS für das lokale Homelab
#
# dnsmasq (in Pi-hole/FTL eingebettet) beantwortet mit dieser einen Zeile ALLE
# Namen unter apphost.lan – die Domain selbst UND jede beliebige Subdomain
# (auth., cloud., office., grafana., …):
#
#   address=/apphost.lan/192.168.178.45
#          └── Domain ──┘└─── Ziel-IP ──┘   (App-Host-VM / Traefik)
#
# Ergebnis:
#   apphost.lan        A  192.168.178.45
#   *.apphost.lan      A  192.168.178.45     (auth., cloud., grafana., …)
#
# AAAA/IPv6: dnsmasq liefert für apphost.lan bewusst KEIN AAAA (NODATA) und
# leitet nichts nach oben weiter – Dual-Stack-Clients fallen sauber auf A
# zurück. Hat die App-Host-VM eine feste IPv6, hier zusätzlich ergänzen:
#   address=/apphost.lan/<IPv6-der-App-Host-VM>
#
# Alles AUSSERHALB von apphost.lan bleibt unberührt und geht an den Upstream
# (FritzBox), damit fritz.box & andere lokale Gerätenamen weiter auflösen.
# ─────────────────────────────────────────────────────────────────────────────
address=/apphost.lan/192.168.178.45
