# ─────────────────────────────────────────────────────────────────────────────
# Eigene lokale DNS-Einträge / Routing
#
# Jede *.conf in diesem Verzeichnis wird von Pi-hole (dnsmasq) automatisch
# geladen – dank  ./dnsmasq.d:/etc/dnsmasq.d:ro  in docker-compose.yml und
# FTLCONF_misc_etc_dnsmasq_d=true. Also einfach hier eintragen (oder eine
# weitere Datei dnsmasq.d/30-....conf anlegen), dann:
#     cd /opt/pihole && docker compose up -d      # bzw. Alias: up  (oder restart)
#     verify                                       # optional gegenprüfen
#
# Standardmäßig ist unten alles auskommentiert – dnsmasq ignoriert Kommentare,
# die Datei ist also „leer" bis du etwas aktivierst. Danach committen/pushen,
# damit es im Repo landet und per 'pull' auf die VM kommt.
#
# WICHTIG: Nur exakte Namen + CNAMEs kann man auch in der Pi-hole-Weboberfläche
# klicken – die landen aber NUR im Container-Volume, nicht im Repo. Für einen
# reproduzierbaren, versionierten Stand (und für Wildcards) diese Datei nutzen.
# ─────────────────────────────────────────────────────────────────────────────

# ── Wildcard: eine Domain inkl. ALLER Subdomains -> eine IP ──────────────────
# (genau wie apphost.lan – z.B. ein zweites Projekt / ein weiterer Reverse-Proxy)
#address=/example.lan/192.168.178.60

# ── Einzelner Host: genau EIN Name -> IP (inkl. passendem PTR/Reverse) ───────
#host-record=nas.lan,192.168.178.20
#host-record=drucker.lan,192.168.178.30

# ── Alias (CNAME) auf einen bestehenden Namen ───────────────────────────────
#cname=git.apphost.lan,apphost.lan

# ── Eine einzelne Subdomain gezielt woanders hin ────────────────────────────
# Hinweis: address=/name/IP matcht name UND dessen Subdomains. Für GENAU einen
# Namen ist host-record= präziser (matcht keine Subdomains).
#host-record=status.apphost.lan,192.168.178.99

# ── Bedingte Weiterleitung: eine Domain an einen anderen DNS-Server ──────────
# (z.B. eine Firmen-/VPN-Zone an deren internen Resolver delegieren)
#server=/firma.intern/10.0.0.53
